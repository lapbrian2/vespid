<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VESPID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Geist+Mono&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Geist';
      src: url('https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2');
      font-weight: 500;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #09090B;
      color: #F5F5F0;
      font-family: 'Geist', sans-serif;
      overflow: hidden;
      height: 100vh;
      cursor: default;
    }

    /* ── Loading ─────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 200; background: #09090B;
      transition: opacity 1s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    .loading-title {
      font-weight: 500; font-size: 14px;
      letter-spacing: 0.3em; text-transform: uppercase;
    }
    .loading-sub {
      font-family: 'Geist Mono', monospace;
      font-size: 12px; color: #71717A; margin-top: 8px;
    }
    .loading-bar {
      width: 120px; height: 1px; background: #333;
      margin: 16px 0; position: relative; overflow: hidden;
    }
    .loading-bar::after {
      content: ''; position: absolute; inset: 0;
      background: #F5F5F0;
      animation: loadSlide 1.5s ease infinite;
    }
    @keyframes loadSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ── Canvas ──────────────────────────────────────── */
    canvas { display: block; position: fixed; inset: 0; }

    /* ── Title — top left ────────────────────────────── */
    #title {
      position: fixed; top: 32px; left: 40px; z-index: 10;
      opacity: 0; transition: opacity 0.8s ease 0.3s;
    }
    #title.visible { opacity: 1; }
    .title-label {
      font-family: 'Geist Mono', monospace;
      font-size: 11px; color: #52525B; letter-spacing: 0.12em;
    }
    .title-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: 28px;
      color: #F5F5F0; margin-top: 4px;
      letter-spacing: -0.02em;
    }
    .title-species {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: 14px; color: #52525B; margin-top: 2px;
    }

    /* ── State buttons — bottom center ───────────────── */
    #controls {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 28px; z-index: 10;
      opacity: 0; transition: opacity 0.8s ease 0.5s;
    }
    #controls.visible { opacity: 1; }
    .state-btn {
      font-family: 'Geist Mono', monospace;
      font-size: 10px; letter-spacing: 0.15em;
      text-transform: uppercase; color: #52525B;
      background: none; border: none; cursor: pointer;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.3s, border-color 0.3s;
    }
    .state-btn:hover { color: #A1A1AA; }
    .state-btn.active { color: #F5F5F0; border-bottom-color: #B8964E; }

    /* ── Anatomy labels ──────────────────────────────── */
    #labels-container {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 15;
    }
    .anatomy-label {
      position: absolute;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .anatomy-label.visible { opacity: 1; }
    .label-title {
      font-weight: 500; font-size: 10px;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: #F5F5F0; margin-bottom: 6px;
    }
    .label-items {
      display: flex; flex-direction: column; gap: 2px;
    }
    .label-item {
      font-weight: 400; font-size: 10px;
      color: #71717A; letter-spacing: 0.05em;
      padding-left: 10px;
      border-left: 1px solid #333;
    }

    /* ── Nav arrows — bottom corners ─────────────────── */
    .nav-link {
      position: fixed; bottom: 32px; z-index: 10;
      font-family: 'Geist Mono', monospace;
      font-size: 10px; letter-spacing: 0.1em;
      color: #52525B; text-decoration: none;
      transition: color 0.3s;
      opacity: 0; transition: opacity 0.8s ease 0.7s, color 0.3s;
    }
    .nav-link.visible { opacity: 1; }
    .nav-link:hover { color: #A1A1AA; }
    .nav-prev { left: 40px; }
    .nav-next { right: 40px; }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-title">LOADING</div>
    <div class="loading-bar"></div>
    <div class="loading-sub">[01] VESPID</div>
  </div>

  <!-- Title -->
  <div id="title">
    <div class="title-label">[01] VESPID</div>
    <div class="title-name">Vespid</div>
    <div class="title-species">Vespa orientalis</div>
  </div>

  <!-- State buttons -->
  <div id="controls">
    <button class="state-btn active" data-state="idle">Idle</button>
    <button class="state-btn" data-state="hover">Hover</button>
    <button class="state-btn" data-state="fly">Fly</button>
  </div>

  <!-- Anatomy labels — anchored to 3D positions -->
  <div id="labels-container">
    <div class="anatomy-label" data-anchor="mandibles">
      <div class="label-title">Mandibula</div>
      <div class="label-items">
        <div class="label-item">Mastication &amp; manipulation</div>
        <div class="label-item">Prey processing</div>
      </div>
    </div>
    <div class="anatomy-label" data-anchor="thorax">
      <div class="label-title">Thorax</div>
      <div class="label-items">
        <div class="label-item">Indirect flight muscles</div>
        <div class="label-item">Wing articulation</div>
      </div>
    </div>
    <div class="anatomy-label" data-anchor="abdomen">
      <div class="label-title">Abdomen</div>
      <div class="label-items">
        <div class="label-item">Venom sac + stinger</div>
        <div class="label-item">Tracheal system</div>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <a href="#" class="nav-link nav-prev">&lt;Prev</a>
  <a href="#" class="nav-link nav-next">Next&gt;</a>

  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


    // ════════════════════════════════════════════════════════════════
    // SCENE
    // ════════════════════════════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06060a, 0.4);

    const camera = new THREE.PerspectiveCamera(
      30, window.innerWidth / window.innerHeight, 0.01, 50
    );
    camera.position.set(0, 0.1, 2.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x09090B);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    document.body.appendChild(renderer.domElement);


    // ════════════════════════════════════════════════════════════════
    // LIGHTING
    // ════════════════════════════════════════════════════════════════
    scene.add(new THREE.AmbientLight(0x333344, 0.6));

    const key = new THREE.DirectionalLight(0xFFE4B5, 2.5);
    key.position.set(4, 4, 5);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x4466CC, 1.0);
    rim.position.set(-4, 1, -4);
    scene.add(rim);

    const fill = new THREE.DirectionalLight(0xFFDDBB, 0.4);
    fill.position.set(-2, -2, 3);
    scene.add(fill);

    const top = new THREE.DirectionalLight(0xFFFFEE, 0.3);
    top.position.set(0, 5, 0);
    scene.add(top);

    // Environment map
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envS = new THREE.Scene();
    envS.add(new THREE.Mesh(
      new THREE.SphereGeometry(10, 32, 16),
      new THREE.MeshBasicMaterial({ color: 0x0a0a12, side: THREE.BackSide })
    ));
    const sg = new THREE.SphereGeometry(0.5, 8, 8);
    const s1 = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: 0xFFFFFF }));
    s1.position.set(4, 4, 4); envS.add(s1);
    const s2 = new THREE.Mesh(sg.clone(), new THREE.MeshBasicMaterial({ color: 0x3355AA }));
    s2.position.set(-4, -1, -3); envS.add(s2);
    scene.environment = pmrem.fromScene(envS, 0.04).texture;
    pmrem.dispose();


    // ════════════════════════════════════════════════════════════════
    // PARTICLES — floating dust motes
    // ════════════════════════════════════════════════════════════════
    const PC = 300;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PC * 3);
    const pVel = new Float32Array(PC * 3);
    for (let i = 0; i < PC; i++) {
      pPos[i*3]   = (Math.random()-0.5) * 5;
      pPos[i*3+1] = (Math.random()-0.5) * 3;
      pPos[i*3+2] = (Math.random()-0.5) * 5;
      pVel[i*3]   = (Math.random()-0.5) * 0.0008;
      pVel[i*3+1] = Math.random() * 0.0005 + 0.0001;
      pVel[i*3+2] = (Math.random()-0.5) * 0.0008;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: 0xB8964E, size: 0.006, transparent: true, opacity: 0.25,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    })));


    // ════════════════════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════════════════════
    let waspModel = null;
    let waspPivot = null;
    const clock = new THREE.Clock();
    const mouse = { x: 0, y: 0 };
    let animState = 'idle';


    // ════════════════════════════════════════════════════════════════
    // LOAD MODEL
    // ════════════════════════════════════════════════════════════════
    new GLTFLoader().load('./wasp.glb', (gltf) => {
      waspPivot = new THREE.Group();
      waspModel = gltf.scene;

      const box = new THREE.Box3().setFromObject(waspModel);
      const center = box.getCenter(new THREE.Vector3());
      waspModel.position.sub(center);

      const size = box.getSize(new THREE.Vector3());
      const scale = 2.2 / Math.max(size.x, size.y, size.z);
      waspModel.scale.setScalar(scale);

      waspPivot.add(waspModel);
      scene.add(waspPivot);

      labelsReady = true;

      // Reveal UI
      document.getElementById('loading').classList.add('fade-out');
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('title').classList.add('visible');
        document.getElementById('controls').classList.add('visible');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.add('visible'));
      }, 1000);
    });


    // ════════════════════════════════════════════════════════════════
    // ORBIT CONTROLS — drag to rotate, scroll to zoom
    // ════════════════════════════════════════════════════════════════
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 1.0;
    controls.maxDistance = 6.0;
    controls.target.set(0, 0, 0);
    controls.autoRotate = false;
    controls.rotateSpeed = 0.5;
    controls.zoomSpeed = 0.8;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });


    // ════════════════════════════════════════════════════════════════
    // ANATOMY LABELS — anchored to 3D world positions
    // ════════════════════════════════════════════════════════════════
    // These are approximate positions relative to the model center
    // Adjusted after model loads based on bounding box
    const labelAnchors = {
      mandibles: new THREE.Vector3(0.35, -0.02, 0.1),
      thorax:    new THREE.Vector3(0, 0.12, -0.05),
      abdomen:   new THREE.Vector3(-0.3, 0.0, -0.05),
    };

    const labelElements = {};
    document.querySelectorAll('.anatomy-label').forEach(el => {
      labelElements[el.dataset.anchor] = el;
    });

    let labelsReady = false;

    function updateLabels() {
      if (!waspModel || !labelsReady) return;

      for (const [key, anchor] of Object.entries(labelAnchors)) {
        const el = labelElements[key];
        if (!el) continue;

        // Transform anchor by wasp pivot + model
        const worldPos = anchor.clone();
        waspPivot.localToWorld(worldPos);

        // Project to screen
        const projected = worldPos.clone().project(camera);
        const sx = (projected.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-projected.y * 0.5 + 0.5) * window.innerHeight;

        // Check if visible (in front of camera)
        if (projected.z < 1) {
          el.style.left = `${sx}px`;
          el.style.top = `${sy}px`;
          el.classList.add('visible');
        } else {
          el.classList.remove('visible');
        }
      }
    }


    // ════════════════════════════════════════════════════════════════
    // STATE BUTTONS
    // ════════════════════════════════════════════════════════════════
    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        animState = btn.dataset.state;
        document.querySelectorAll('.state-btn').forEach(b =>
          b.classList.toggle('active', b === btn)
        );
      });
    });


    // ════════════════════════════════════════════════════════════════
    // ANIMATION — three distinct behaviors
    // ════════════════════════════════════════════════════════════════

    function updateAnimation(t) {
      if (!waspPivot) return;

      if (animState === 'idle') {
        // IDLE: perched/resting. Barely moves. Occasional tiny shift.
        const breathe = Math.sin(t * 0.8) * 0.002;
        waspPivot.position.y = breathe;
        waspPivot.position.x = Math.sin(t * 0.2) * 0.001;
        waspPivot.rotation.x = -0.02;
        waspPivot.rotation.z = 0;
        waspPivot.rotation.y = 0;

      } else if (animState === 'hover') {
        // HOVER: airborne, smooth figure-8 drift, body tilted forward
        const driftX = Math.sin(t * 0.4) * 0.06;
        const driftY = Math.sin(t * 0.6) * 0.02 + Math.sin(t * 1.1) * 0.008;
        const driftZ = Math.cos(t * 0.35) * 0.03;

        waspPivot.position.x = driftX;
        waspPivot.position.y = driftY;
        waspPivot.position.z = driftZ;

        // Bank into the drift direction (body tilts the way it's moving)
        waspPivot.rotation.z = -Math.cos(t * 0.4) * 0.4 * 0.08;
        waspPivot.rotation.x = -0.12; // Forward lean — flight posture
        waspPivot.rotation.y = Math.cos(t * 0.4) * 0.04; // Slight yaw into drift

      } else if (animState === 'fly') {
        // FLY: fast orbiting flight path, banking turns, speed
        const radius = 0.15;
        const speed = 0.7;
        const flightX = Math.sin(t * speed) * radius;
        const flightZ = Math.cos(t * speed) * radius * 0.6;
        const flightY = Math.sin(t * speed * 2) * 0.03; // Altitude changes

        waspPivot.position.x = flightX;
        waspPivot.position.y = flightY;
        waspPivot.position.z = flightZ;

        // Bank hard into turns — this is what makes it look like real flight
        const bankAngle = -Math.cos(t * speed) * 0.25;
        const pitch = -0.18; // Nose down in flight
        const yaw = -Math.cos(t * speed) * 0.15; // Face direction of travel

        waspPivot.rotation.x = pitch;
        waspPivot.rotation.z = bankAngle;
        waspPivot.rotation.y = yaw;
      }
    }


    // ════════════════════════════════════════════════════════════════
    // RENDER LOOP
    // ════════════════════════════════════════════════════════════════
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      updateAnimation(t);

      controls.update();

      // Particles
      const pp = pGeo.attributes.position.array;
      for (let i = 0; i < PC; i++) {
        pp[i*3]   += pVel[i*3] + Math.sin(t+i)*0.00003;
        pp[i*3+1] += pVel[i*3+1];
        pp[i*3+2] += pVel[i*3+2];
        if (Math.abs(pp[i*3]) > 2.5) pp[i*3] *= -0.9;
        if (pp[i*3+1] > 1.5) pp[i*3+1] = -1.5;
        if (Math.abs(pp[i*3+2]) > 2.5) pp[i*3+2] *= -0.9;
      }
      pGeo.attributes.position.needsUpdate = true;

      updateLabels();
      renderer.render(scene, camera);
    }
    animate();


    // ════════════════════════════════════════════════════════════════
    // RESIZE
    // ════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
