<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VESPID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{overflow:hidden;height:100%}
    body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;font-size:62.5%}

    /* ── Loader ───────────────────────────── */
    #loader{position:absolute;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center}
    #loader-inner{text-align:center}
    #loader-text{font-size:1.4em;font-weight:300;color:#fff;text-transform:uppercase;letter-spacing:6px}
    #loader-bar{width:120px;height:2px;background:rgba(255,255,255,0.2);border-radius:4px;margin:14px auto 0;overflow:hidden}
    #loader-fill{width:0%;height:100%;background:#fff;border-radius:4px;transition:width 0.3s}
    #loader-title{font-size:1.4em;font-weight:300;color:#fff;text-transform:uppercase;letter-spacing:6px;margin-top:12px;transform:translateY(12px);opacity:0;transition:opacity 0.5s,transform 0.5s}

    /* ── Canvas ────────────────────────────── */
    #webglCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;touch-action:none}

    /* ── Menu (top-left) ──────────────────── */
    #menu{position:fixed;top:0;left:0;right:0;pointer-events:none;opacity:0;visibility:hidden;padding:20px;z-index:5}
    #menu.visible{opacity:1;visibility:visible}
    #menu-header{display:flex;flex-direction:column;gap:4px}
    .menu-copy{font-size:1.4em;font-weight:300;color:#fff;letter-spacing:6px;text-transform:uppercase;padding:6px;background:rgba(0,0,0,0.75);width:fit-content}
    #menu-lab{font-size:2em;color:#fff;text-decoration:none;padding:2px 6px;background:rgba(0,0,0,0.75);display:inline-block;pointer-events:auto}
    #menu-lab span:nth-child(2){margin-left:-7px}
    #menu-lab span:nth-child(3){margin-left:-8px}
    #menu-nav{position:fixed;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
    .nav-btn{pointer-events:auto}
    .nav-btn{font-size:1.4em;font-weight:300;color:#fff;letter-spacing:6px;text-transform:uppercase;text-decoration:none;padding:6px;background:rgba(0,0,0,0.75)}
    .nav-btn:hover{color:#ccc}

    /* ── Animation picker (bottom-center) ── */
    #picker{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:5;opacity:0;visibility:hidden}
    #picker.visible{opacity:1;visibility:visible}
    .pick-btn{font-size:1.4em;font-weight:300;color:#fff;letter-spacing:6px;text-transform:uppercase;background:rgba(0,0,0,0.75);border:none;cursor:pointer;padding:6px;opacity:0.5;transition:opacity 0.3s}
    .pick-btn.active{opacity:1}
    .pick-btn:hover{opacity:0.8}

    /* ── Labels ────────────────────────────── */
    #labels{position:fixed;inset:0;pointer-events:none;z-index:4}
    .label-panel{position:absolute;top:0;left:0;padding:0 6px 0 10px;mix-blend-mode:difference;isolation:isolate;opacity:0;visibility:hidden;white-space:nowrap;width:fit-content;transition:opacity 0.4s,visibility 0.4s}
    .label-panel.visible{opacity:1;visibility:visible}
    .label-name{font-size:1.4em;font-weight:500;letter-spacing:6px;text-transform:uppercase;background:#fff;color:#000;padding:2px 6px;width:fit-content}
    .label-sub{font-size:1.2em;font-weight:300;color:#000;background:#fff;padding:2px 6px;margin-top:4px;display:flex;align-items:center;gap:6px}
    .label-dot{width:4px;height:4px;border-radius:50%;background:#000;flex-shrink:0}

    /* ── Custom cursor ─────────────────────── */
    #cursor{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;pointer-events:none;z-index:20;mix-blend-mode:difference;opacity:0;transform:translate(-50%,-50%);transition:opacity 0.3s}
    #cursor.active{opacity:1}
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div id="loader-inner">
      <div id="loader-text">loading</div>
      <div id="loader-bar"><div id="loader-fill"></div></div>
      <div id="loader-title">[01] Vespid</div>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="webglCanvas"></canvas>

  <!-- Menu -->
  <div id="menu">
    <div id="menu-header">
      <a id="menu-lab" href="#"><span>L</span><span>A</span><span>B</span></a>
      <div class="menu-copy">[01] Vespid</div>
    </div>
    <div id="menu-nav">
      <a class="nav-btn" href="#">&lt;Prev</a>
      <a class="nav-btn" href="#">Next&gt;</a>
    </div>
  </div>

  <!-- Animation picker -->
  <div id="picker">
    <button class="pick-btn active" data-anim="0">Idle</button>
    <button class="pick-btn" data-anim="1">Hover</button>
    <button class="pick-btn" data-anim="2">Fly</button>
  </div>

  <!-- Labels -->
  <div id="labels">
    <div class="label-panel" data-label="0">
      <p class="label-name">Mandibula</p>
      <p class="label-sub"><span class="label-dot"></span>Mastication &amp; manipulation</p>
      <p class="label-sub"><span class="label-dot"></span>Prey processing</p>
    </div>
    <div class="label-panel" data-label="1">
      <p class="label-name">Thorax</p>
      <p class="label-sub"><span class="label-dot"></span>Indirect flight muscles</p>
      <p class="label-sub"><span class="label-dot"></span>Wing articulation</p>
    </div>
    <div class="label-panel" data-label="2">
      <p class="label-name">Abdomen</p>
      <p class="label-sub"><span class="label-dot"></span>Venom sac + stinger</p>
      <p class="label-sub"><span class="label-dot"></span>Tracheal system</p>
    </div>
  </div>

  <!-- Custom cursor -->
  <div id="cursor"></div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
  import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

  // ── SCENE ──────────────────────────────────────────────────────
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(-2.5, 1.0, 2.5);

  const canvas = document.getElementById('webglCanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000);
  renderer.toneMapping = THREE.LinearToneMapping;
  renderer.toneMappingExposure = 2.5;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // ── POST-PROCESSING ────────────────────────────────────────────
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  // FXAA
  const fxaa = new ShaderPass(FXAAShader);
  fxaa.uniforms.resolution.value.set(1/(innerWidth*devicePixelRatio), 1/(innerHeight*devicePixelRatio));
  composer.addPass(fxaa);

  // Vignette (custom shader)
  const vignetteShader = {
    uniforms: { tDiffuse: { value: null }, offset: { value: 0.8 }, darkness: { value: 0.15 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float offset; uniform float darkness; varying vec2 vUv;
      void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 uv=(vUv-0.5)*2.0; float d=1.0-smoothstep(offset,offset+0.5,length(uv)); c.rgb*=mix(1.0-darkness,1.0,d); gl_FragColor=c; }`
  };
  composer.addPass(new ShaderPass(vignetteShader));

  // ── CONTROLS ───────────────────────────────────────────────────
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.minDistance = 1.5;
  controls.maxDistance = 8;
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI * 0.45;
  controls.target.set(0, 0.1, 0);
  controls.rotateSpeed = 0.5;

  // ── LIGHTING ───────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0x888899, 1.5));
  const dirLight = new THREE.DirectionalLight(0xfff5e6, 4.0);
  dirLight.position.set(4, 6, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -3; dirLight.shadow.camera.right = 3;
  dirLight.shadow.camera.top = 3; dirLight.shadow.camera.bottom = -3;
  dirLight.shadow.camera.near = 0.1; dirLight.shadow.camera.far = 20;
  dirLight.shadow.bias = -0.001;
  dirLight.shadow.radius = 3;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xe6f0ff, 2.0);
  fillLight.position.set(-3, 2, -2); scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
  rimLight.position.set(0, 3, -4); scene.add(rimLight);

  const bottomLight = new THREE.DirectionalLight(0xffffff, 0.8);
  bottomLight.position.set(0, -2, 2); scene.add(bottomLight);

  const frontLight = new THREE.DirectionalLight(0xffffff, 1.0);
  frontLight.position.set(0, 1, 5); scene.add(frontLight);

  // Environment
  const pmrem = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16), new THREE.MeshBasicMaterial({color:0x333340,side:THREE.BackSide})));
  const sg = new THREE.SphereGeometry(0.3,8,8);
  const sp1 = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({color:0xffffff})); sp1.position.set(4,4,4); es.add(sp1);
  const sp2 = new THREE.Mesh(sg.clone(), new THREE.MeshBasicMaterial({color:0x4466aa})); sp2.position.set(-3,1,-3); es.add(sp2);
  scene.environment = pmrem.fromScene(es,0.04).texture;
  pmrem.dispose();

  // ── GROUND PLANE ───────────────────────────────────────────────
  // Ground plane — visible, receives shadows
  const groundGeo = new THREE.PlaneGeometry(40, 40);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.85, metalness: 0.0 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.5;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid
  const grid = new THREE.GridHelper(20, 40, 0x444444, 0x222222);
  grid.position.y = -0.49;
  scene.add(grid);

  // ── STATE ──────────────────────────────────────────────────────
  let waspModel = null;
  let mixer = null;
  const actions = [];
  let currentAction = null;
  let labelsShown = true;
  const clock = new THREE.Clock();
  const mouse = { x: 0, y: 0, active: false, timer: null };

  // ── LABEL ANCHORS (world-space positions) ──────────────────────
  const labelAnchors = [
    new THREE.Vector3(0.25, 0.05, 0.1),   // Mandibula (front/head)
    new THREE.Vector3(0.0, 0.15, 0),       // Thorax (top-center)
    new THREE.Vector3(-0.25, 0.0, -0.05),  // Abdomen (rear)
  ];
  const labelEndpoints = [
    new THREE.Vector3(0.6, 0.35, 0.3),     // Mandibula label position
    new THREE.Vector3(-0.3, 0.5, 0.15),    // Thorax label position
    new THREE.Vector3(-0.65, 0.35, -0.15), // Abdomen label position
  ];
  const labelPanels = document.querySelectorAll('.label-panel');

  // ── 3D LABEL LINES ─────────────────────────────────────────────
  const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  const labelLines = [];
  for (let i = 0; i < 3; i++) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      labelAnchors[i], labelEndpoints[i]
    ]);
    const line = new THREE.Line(geo, lineMaterial.clone());
    scene.add(line);
    labelLines.push(line);
  }

  // ── LOAD MODEL ─────────────────────────────────────────────────
  const loaderFill = document.getElementById('loader-fill');
  const loaderTitle = document.getElementById('loader-title');

  new GLTFLoader().load('./wasp.glb',
    (gltf) => {
      waspModel = gltf.scene;
      scene.add(waspModel);

      // Center + scale
      const box = new THREE.Box3().setFromObject(waspModel);
      const center = box.getCenter(new THREE.Vector3());
      waspModel.position.sub(center);
      const size = box.getSize(new THREE.Vector3());
      const s = 2.5 / Math.max(size.x, size.y, size.z);
      waspModel.scale.setScalar(s);
      waspModel.position.y += 0.15;

      // Shadows
      waspModel.traverse(child => {
        if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
      });

      // Animations (if any baked in the model)
      if (gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(waspModel);
        gltf.animations.forEach(clip => {
          const action = mixer.clipAction(clip);
          actions.push(action);
        });
        if (actions[0]) { actions[0].play(); currentAction = actions[0]; }
      }

      // Dismiss loader
      loaderFill.style.width = '100%';
      loaderTitle.style.opacity = '1';
      loaderTitle.style.transform = 'translateY(0)';
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.transition = 'opacity 0.6s';
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
          document.getElementById('menu').classList.add('visible');
          document.getElementById('picker').classList.add('visible');
          showLabels();
        }, 600);
      }, 800);
    },
    (progress) => {
      if (progress.total > 0) {
        const pct = Math.round(progress.loaded / progress.total * 100);
        loaderFill.style.width = pct + '%';
      }
    }
  );

  // ── ANIMATION SWITCHING ────────────────────────────────────────
  function switchAnimation(index) {
    if (!mixer || !actions[index]) {
      // No baked animations — just toggle label visibility
      const isIdle = index === 0;
      if (isIdle && !labelsShown) showLabels();
      if (!isIdle && labelsShown) hideLabels();
      return;
    }

    const newAction = actions[index];
    if (newAction === currentAction) return;

    if (currentAction) {
      currentAction.fadeOut(0.5);
    }
    newAction.reset().fadeIn(0.5).play();
    currentAction = newAction;

    // Labels only in Idle
    if (index === 0 && !labelsShown) showLabels();
    if (index !== 0 && labelsShown) hideLabels();
  }

  function showLabels() {
    labelsShown = true;
    labelPanels.forEach((p, i) => {
      setTimeout(() => p.classList.add('visible'), i * 140);
    });
    labelLines.forEach(l => { l.material.opacity = 0.4; });
  }

  function hideLabels() {
    labelsShown = false;
    labelPanels.forEach(p => p.classList.remove('visible'));
    labelLines.forEach(l => { l.material.opacity = 0; });
  }

  document.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.anim);
      switchAnimation(idx);
      document.querySelectorAll('.pick-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  // ── CUSTOM CURSOR ──────────────────────────────────────────────
  const cursorEl = document.getElementById('cursor');
  document.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top = e.clientY + 'px';
    cursorEl.classList.add('active');
    clearTimeout(mouse.timer);
    mouse.timer = setTimeout(() => cursorEl.classList.remove('active'), 2000);
  });

  // ── UPDATE LABELS ──────────────────────────────────────────────
  function updateLabels() {
    if (!waspModel) return;
    for (let i = 0; i < 3; i++) {
      // Project endpoint to screen
      const wp = labelEndpoints[i].clone();
      if (waspModel) {
        // Transform by model position/scale
        wp.multiplyScalar(waspModel.scale.x);
        wp.add(waspModel.position);
      }
      const projected = wp.clone().project(camera);

      if (projected.z < 1) {
        const sx = (projected.x * 0.5 + 0.5) * innerWidth;
        const sy = (-projected.y * 0.5 + 0.5) * innerHeight;
        labelPanels[i].style.transform = `translate(${sx}px, ${sy}px)`;
      }

      // Update line geometry
      const lineGeo = labelLines[i].geometry;
      const positions = lineGeo.attributes.position.array;
      const anchor = labelAnchors[i].clone().multiplyScalar(waspModel?.scale.x || 1).add(waspModel?.position || new THREE.Vector3());
      const end = wp;
      positions[0] = anchor.x; positions[1] = anchor.y; positions[2] = anchor.z;
      positions[3] = end.x; positions[4] = end.y; positions[5] = end.z;
      lineGeo.attributes.position.needsUpdate = true;
    }
  }

  // ── RENDER LOOP ────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    controls.update();
    updateLabels();
    composer.render();
  }
  animate();

  // ── RESIZE ─────────────────────────────────────────────────────
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
    fxaa.uniforms.resolution.value.set(1/(innerWidth*devicePixelRatio), 1/(innerHeight*devicePixelRatio));
  });
  </script>
</body>
</html>
